# yaml-language-server: $schema=../../schema/manifest.schema.json
topic:
  label: "Remote Access"
  hint: "sshd + Tailscale + mosh + code-server"
  required: false
  order: 90
  description: |
    Reach this machine from anywhere: sshd, Tailscale (with the MTU fix that
    keeps SSH-over-Tailscale from hanging), and mosh for flaky links. The
    optional code-server bundle serves VS Code over your tailnet.

bundles:

  - name: ssh
    label: "SSH server"
    desc: "sshd — Remote Login (mac) / openssh-server (WSL)"
    icon_name: lock
    items:
      - name: remote-login-mac
        type: custom
        script: ./enable-remote-login.sh
        platforms: [mac]
      - name: systemd-wsl
        type: custom
        script: ./enable-systemd-wsl.sh
        platforms: [wsl]
      - name: openssh-server-wsl
        type: apt
        spec: openssh-server
        platforms: [wsl]
      - name: sshd-snippet
        type: deploy
        spec: ./templates/ssh
        idempotent: true

  - name: tailscale
    label: "Tailscale"
    desc: "Tailscale mesh VPN + SSH-over-tailnet MTU fix"
    membership: mesh
    icon_name: globe
    items:
      - name: tailscale-mac
        type: custom
        script: ./install-tailscale-mac.sh
        platforms: [mac]
      - name: tailscale-wsl
        type: custom
        script: ./install-tailscale-wsl.sh
        platforms: [wsl]
      - name: tailscale-mtu-wsl
        type: custom
        script: ./tailscale-mtu-fix-wsl.sh
        platforms: [wsl]
      - name: shell-fragments
        type: deploy
        spec: ./templates/tailscale
        idempotent: true

  - name: mosh
    label: "mosh"
    desc: "Mobile shell — survives roaming & flaky links"
    icon_name: terminal
    items:
      - name: mosh-mac
        type: brew-formula
        spec: mosh
        platforms: [mac]
        # Operational check (verify/operational plan §B): mosh is "listed" by
        # brew even when mosh-server can't load its protobuf dylib after a
        # major-version bump. Presence AND a static Mach-O resolve of mosh-server
        # (standalone helper — bash -c cannot see driver functions). Broken ⇒
        # check fails ⇒ reinstall-aware brew_formula_install ⇒ `brew reinstall`.
        check: 'HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 "${BREW_BIN:-brew}" list --formula -- mosh >/dev/null 2>&1 && bash "$MESH_LIB_DIR/mach-o-resolvable.sh" "$(HOMEBREW_NO_AUTO_UPDATE=1 ${BREW_BIN:-brew} --prefix)/bin/mosh-server"'
      - name: mosh-wsl
        type: apt
        spec: mosh
        platforms: [wsl]
      - name: mosh-path-mac
        type: custom
        script: ./mosh-path-fix.sh
        platforms: [mac]
        when: brew_prefix_custom

  - name: code-server
    label: "code-server"
    desc: "VS Code in the browser over your tailnet (opt-in)"
    platforms: [mac]
    default_selected: false
    membership: mesh
    icon_name: code
    requires_bundles:
      - remote-access/tailscale
    items:
      - name: code-server
        type: custom
        script: ./mac/code-server.sh
        platforms: [mac]
        uninstall_tier: 2

  - name: tuios
    label: "TUIOS + browser terminal"
    desc: "Persistent terminal sessions shared by CLI and local browser"
    platforms: [mac, wsl]
    default_selected: false
    icon_name: terminal
    items:
      - name: tuios-binaries
        type: custom
        script: ./tuios/install-binaries.sh
        autoupdate: true
        restart_service: tuios-local-web
      - name: tuios-local-web
        type: custom
        script: ./tuios/services.sh

  - name: tuios-cloudflare
    label: "TUIOS remote browser access"
    desc: "Install cloudflared; publish only after configuring Cloudflare Access"
    platforms: [mac, wsl]
    default_selected: false
    requires_bundles:
      - remote-access/tuios
    icon_name: globe
    items:
      - name: cloudflared
        type: custom
        script: ./tuios/install-cloudflared.sh
